name: Deploy Streamlit

on:
  push:
    paths:
      - src/**
      - .github/workflows/ci_cd.yml

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    # Login to GHCR
    - name: Login GHCR
      run: echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    # Build image
    - name: Build Streamlit
      run: |
        docker build -t ghcr.io/davnish/streamlit-server:${{ github.sha }} streamlit.Dockerfile .

    # Push image
    - name: Push Image
      run: |
        docker push ghcr.io/davnish/streamlit-server:${{ github.sha }}

    # Install Helm
    - name: Install Helm
      uses: azure/setup-helm@v4

    # Configure kubeconfig
    - name: Setup kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

    # Verify cluster access
    - name: Test cluster connection
      run: kubectl get nodes

    # Deploy
    - name: Deploy Helm
      run: |
        helm upgrade --install cocolit ./charts/cocolit \
          --namespace apps \
          --create-namespace \
          --set streamlit.image.tag=${{ github.sha }}