name: CI

# Tests, Helm lint, and multi-arch images pushed to GHCR.
# Deploys are run from the cluster side (scripts/deploy_laptop.sh); GitHub
# cannot reach the k3s API, which is only exposed through the Cloudflare Tunnel.

on:
  push:
    branches: [main, frontend]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.matrix }}
      chart: ${{ github.ref_type == 'tag' || steps.filter.outputs.chart == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared: &shared
              - 'src/**'
              - 'configs/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci_cd.yml'
            frontend:
              - *shared
              - 'main.py'
              - 'static/**'
              - 'data/countries/**'
              - 'frontend.Dockerfile'
              - 'requirements_streamlit.txt'
            inference:
              - *shared
              - 'pipelines/**'
              - 'models/**'
              - 'inference.Dockerfile'
              - 'requirements_inference.txt'
            chart:
              - 'infra/charts/**'
              - '.github/workflows/ci_cd.yml'
      - id: images
        name: Images to build (both on release tags)
        env:
          TAG: ${{ github.ref_type == 'tag' }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          INFERENCE: ${{ steps.filter.outputs.inference }}
        run: |
          items=()
          if [ "$TAG" = true ] || [ "$FRONTEND" = true ]; then
            items+=('{"component":"frontend","dockerfile":"frontend.Dockerfile","image":"ghcr.io/davnish/streamlit-server"}')
          fi
          if [ "$TAG" = true ] || [ "$INFERENCE" = true ]; then
            items+=('{"component":"inference","dockerfile":"inference.Dockerfile","image":"ghcr.io/davnish/inference-server"}')
          fi
          echo "matrix=[$(IFS=,; echo "${items[*]}")]" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install (from uv.lock)
        run: uv sync --locked
      - name: Unit tests
        run: uv run pytest tests --ignore=tests/integration -q

  helm:
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render (default and laptop values, all options on)
        run: |
          CHART=infra/charts/cocolit
          helm lint $CHART
          helm lint $CHART -f $CHART/values-laptop.yaml
          helm template cocolit $CHART -n apps -f $CHART/values-laptop.yaml \
            --set cloudflared.enabled=true --set overflow.enabled=true \
            --set inference.hpa.enabled=true --set otel.endpoint=http://alloy:4318 > /dev/null

  image:
    needs: [changes, test]
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build (amd64 for Cloud Run, arm64 for Oracle A1 / Apple Silicon)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ASSET_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
