name: Build and Deploy Streamlit

on:
  push:
    paths:
      - "src/**"
      - ".github/workflows/ci_cd.yml"
      - "infra/charts/cocolit/**"
      - "streamlit.Dockerfile"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    # Generate short SHA
    - name: Set short SHA
      run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

    # Setup Docker Buildx
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Login to GHCR
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}

    # Build and push Docker image
    - name: Build and Push Streamlit Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: streamlit.Dockerfile
        push: true
        tags: ghcr.io/davnish/streamlit-server:${{ env.SHORT_SHA }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Install kubectl
    - name: Install kubectl
      uses: azure/setup-kubectl@v4

    # Install Helm
    - name: Install Helm
      uses: azure/setup-helm@v4

    # Configure kubeconfig
    - name: Setup kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

    # Verify cluster access
    - name: Verify cluster connection
      run: kubectl get nodes

    # Deploy via Helm
    - name: Deploy with Helm
      run: |
        echo "${{ secrets.CREDENTIALS }}" > credentials.yaml

        helm upgrade --install cocolit ./infra/charts/cocolit \
          --namespace apps \
          --create-namespace \
          -f credentials.yaml \
          --set streamlit.image.tag=${{ env.SHORT_SHA }}
