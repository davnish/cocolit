<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#0a0a0a;font-family:Geist,sans-serif;color:#ededed}
  .frame{box-sizing:border-box;width:100%;height:100%;padding:88px 96px;display:flex;flex-direction:column;justify-content:space-between;
    background-image:linear-gradient(#161616 1px,transparent 1px),linear-gradient(90deg,#161616 1px,transparent 1px);background-size:48px 48px;background-position:-1px -1px}
  .mark{font-weight:600;font-size:40px;letter-spacing:-.04em}.mark .org{color:#a1a1a1;font-size:28px;letter-spacing:-.02em;margin-right:14px}.lit{color:#f2b544}
  h1{margin:0;font-weight:600;font-size:76px;line-height:1.02;letter-spacing:-.05em;max-width:1000px}
  .row{display:flex;justify-content:space-between;align-items:center}
  .url{font-family:'Geist Mono',monospace;font-size:26px;color:#a1a1a1}
  .count{font-family:'Geist Mono',monospace;font-size:24px;color:#6fd49a}
</style></head><body><div class="frame">
  <div class="mark"><span class="org">rollingdraft ·</span>Coco<span class="lit">lit</span> 🌴</div>
  <h1>Count coconut trees<br>on satellite maps.</h1>
  <div class="row"><div class="url">cocolit.rollingdraft.com</div><div class="count">● YOLO11n · up to 0.5 km² a box</div></div>
</div></body></html>
