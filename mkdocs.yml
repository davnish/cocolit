site_name: Cocolit
site_url: https://github.com/davnish/cocolit.git

theme:
  name: material


repo_name: davnish/cocolit
repo_url: https://github.com/davnish/cocolit

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg