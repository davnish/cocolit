# Endpoints for the app cluster, reachable only inside the VCN
# (ports 30090-30099 are allowed from 10.0.0.0/16 in infra/oci/main.tf).
# 30090-30092 take metrics, logs and traces in; the website also reads
# Prometheus (30090) and Tempo (30093) for its "Live from the server" section.
apiVersion: v1
kind: Service
metadata:
  name: ingest-prometheus
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - {name: http, port: 9090, targetPort: 9090, nodePort: 30090}
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-loki
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: single-binary
  ports:
    - {name: http, port: 3100, targetPort: 3100, nodePort: 30091}
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-tempo
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: tempo
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: 4317, nodePort: 30092}
---
apiVersion: v1
kind: Service
metadata:
  name: query-tempo
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: tempo
  ports:
    - {name: http, port: 3200, targetPort: 3200, nodePort: 30093}
