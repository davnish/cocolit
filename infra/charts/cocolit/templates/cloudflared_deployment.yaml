{{- if .Values.cloudflared.enabled }}
# Outbound-only Cloudflare Tunnel: no open ports or public IP needed.
# Public hostname -> service mapping lives in the Cloudflare dashboard
# (cocolit.prithvilabs.com -> http://{{ include "cocolit.fullname" . }}-streamlit-service:80).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cocolit.fullname" . }}-cloudflared
  labels:
    project: cocolit
spec:
  replicas: {{ .Values.cloudflared.replicaCount }}
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
      - name: cloudflared
        image: "{{ .Values.cloudflared.image }}"
        args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.cloudflared.tokenSecret }}
              key: token
        livenessProbe:
          httpGet: { path: /ready, port: 2000 }
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { memory: 128Mi }
{{- end }}
