apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque  # immutable; existing clusters already use Opaque
stringData:
  # CloudNativePG reads username/password; the app reads password.
  username: {{ .Values.database.username | quote }}
  password: {{ .Values.database.password | quote }}
  postgres-password: {{ .Values.database.postgresPassword | quote }}
  database: {{ .Values.database.database | quote }}
