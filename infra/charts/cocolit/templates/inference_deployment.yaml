apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cocolit.fullname" . }}-inference-server
  labels:
    project: cocolit
spec:
  replicas: {{ .Values.inference.replicaCount }}
  selector:
    matchLabels:
      app: inference-server
  template:
    metadata:
      labels:
        app: inference-server
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: inference-server
        image: "{{ .Values.inference.image.repository }}:{{ .Values.inference.image.tag }}"
        imagePullPolicy: {{ .Values.inference.image.pullPolicy | default "IfNotPresent" }}
        ports:
        - containerPort: 8000
        env:
        {{- if .Values.inference.ortThreads }}
        - name: ORT_THREADS
          value: {{ .Values.inference.ortThreads | quote }}
        {{- end }}
        {{- include "cocolit.otelEnv" (dict "root" . "service" "cocolit-inference") | nindent 8 }}
        readinessProbe:
          httpGet: { path: /health, port: 8000 }
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /health, port: 8000 }
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          {{- toYaml .Values.inference.resources | nindent 10 }}
