apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgis-cluster
spec:
  instances: 1
  imageName: {{ .Values.postgis.image }}

  bootstrap:
    initdb:
      database: {{ .Values.database.database | quote }}
      owner: {{ .Values.database.username | quote }}
      secret:
        name: postgres-credentials
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS postgis;

  storage:
    size: {{ .Values.postgis.storageSize }}
    {{- with .Values.postgis.storageClass }}
    storageClass: {{ . }}
    {{- end }}

  resources:
    {{- toYaml .Values.postgis.resources | nindent 4 }}
