[project]
name = "cocolit"
version = "0.0.2"
description = "lets detect some coconuts!"
requires-python = ">=3.11"
# Union of requirements_inference.txt and requirements_streamlit.txt (the
# Dockerfiles install from those; this is for local `uv sync`).
dependencies = [
    "onnxruntime==1.23.2",
    "numpy==1.26.4",
    "pillow>=10",
    "httpx>=0.28",
    "pydantic>=2",
    "pyyaml>=6",
    "fastapi>=0.162.5",
    "uvicorn>=0.40.0",
    "orjson>=3.11.6",
    "python-dotenv>=1.2.2",
    "python-multipart",
    "requests",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "sqlmodel>=0.0.31",
    "geoalchemy2",
    "psycopg[binary]>=3.2",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-instrumentation-requests==0.66b2",
    "opentelemetry-instrumentation-sqlalchemy==0.66b2",
    # Security floors (Dependabot advisories)
    "protobuf>=6.33.5",  # GHSA-7gcm-g887-7qv7
    "starlette>=1.3.1",  # GHSA-82w8-qh3p-5jfq and 4 more
    "anyio>=4.14.2",  # GHSA-82r6-8w77-94w6, GHSA-5p39-cfhj-2xmp
    "idna>=3.15",  # GHSA-65pc-fj4g-8rjx
]

[dependency-groups]
dev = ["pytest", "pytest-mock"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
